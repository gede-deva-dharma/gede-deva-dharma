<svg width="900" height="160" viewBox="0 0 900 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .particle { animation: float linear infinite; }
      .line { animation: fadeLines linear infinite; }
      .wave1 { animation: waveMove1 6s ease-in-out infinite; }
      .wave2 { animation: waveMove2 8s ease-in-out infinite; }
      .wave3 { animation: waveMove3 10s ease-in-out infinite; }
      .title { animation: fadeInUp 1.2s ease forwards; opacity: 0; }
      .subtitle { animation: fadeInUp 1.2s ease 0.4s forwards; opacity: 0; }
      .dot { animation: pulse 3s ease-in-out infinite; }

      @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(10px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes waveMove1 {
        0%,100% { d: path("M0,100 C150,80 300,120 450,100 C600,80 750,120 900,100 L900,160 L0,160 Z"); }
        50%      { d: path("M0,115 C150,95 300,135 450,115 C600,95 750,135 900,115 L900,160 L0,160 Z"); }
      }
      @keyframes waveMove2 {
        0%,100% { d: path("M0,110 C120,90 270,130 450,108 C630,86 780,126 900,108 L900,160 L0,160 Z"); }
        50%      { d: path("M0,120 C120,100 270,140 450,118 C630,96 780,136 900,118 L900,160 L0,160 Z"); }
      }
      @keyframes waveMove3 {
        0%,100% { d: path("M0,120 C100,100 280,140 450,118 C620,96 800,136 900,120 L900,160 L0,160 Z"); }
        50%      { d: path("M0,128 C100,108 280,148 450,126 C620,104 800,144 900,128 L900,160 L0,160 Z"); }
      }
      @keyframes float0 { 0%{transform:translate(0,0)} 50%{transform:translate(4px,-6px)} 100%{transform:translate(0,0)} }
      @keyframes float1 { 0%{transform:translate(0,0)} 50%{transform:translate(-5px,5px)} 100%{transform:translate(0,0)} }
      @keyframes float2 { 0%{transform:translate(0,0)} 50%{transform:translate(6px,4px)} 100%{transform:translate(0,0)} }
      @keyframes float3 { 0%{transform:translate(0,0)} 50%{transform:translate(-3px,-7px)} 100%{transform:translate(0,0)} }
      @keyframes float4 { 0%{transform:translate(0,0)} 50%{transform:translate(5px,3px)} 100%{transform:translate(0,0)} }
      @keyframes float5 { 0%{transform:translate(0,0)} 50%{transform:translate(-6px,6px)} 100%{transform:translate(0,0)} }
      @keyframes float6 { 0%{transform:translate(0,0)} 50%{transform:translate(3px,-5px)} 100%{transform:translate(0,0)} }
      @keyframes float7 { 0%{transform:translate(0,0)} 50%{transform:translate(-4px,4px)} 100%{transform:translate(0,0)} }
      @keyframes float8 { 0%{transform:translate(0,0)} 50%{transform:translate(6px,-3px)} 100%{transform:translate(0,0)} }
      @keyframes float9 { 0%{transform:translate(0,0)} 50%{transform:translate(-5px,-5px)} 100%{transform:translate(0,0)} }
      @keyframes float10 { 0%{transform:translate(0,0)} 50%{transform:translate(4px,6px)} 100%{transform:translate(0,0)} }
      @keyframes float11 { 0%{transform:translate(0,0)} 50%{transform:translate(-6px,3px)} 100%{transform:translate(0,0)} }
      @keyframes float12 { 0%{transform:translate(0,0)} 50%{transform:translate(5px,-4px)} 100%{transform:translate(0,0)} }
      @keyframes float13 { 0%{transform:translate(0,0)} 50%{transform:translate(-3px,6px)} 100%{transform:translate(0,0)} }
      @keyframes float14 { 0%{transform:translate(0,0)} 50%{transform:translate(7px,2px)} 100%{transform:translate(0,0)} }
      @keyframes fadeLines {
        0%,100% { opacity: 0.12; }
        50%      { opacity: 0.22; }
      }
      @keyframes pulse {
        0%,100% { opacity: 0.4; r: 3; }
        50%      { opacity: 0.9; r: 5; }
      }
    </style>

    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0f1a2e"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </radialGradient>
  </defs>

  <rect width="900" height="160" fill="url(#bgGrad)"/>

  <!-- Grid lines subtle -->
  <g opacity="0.04" stroke="#378ADD" stroke-width="0.5">
    <line x1="0" y1="40" x2="900" y2="40"/>
    <line x1="0" y1="80" x2="900" y2="80"/>
    <line x1="0" y1="120" x2="900" y2="120"/>
    <line x1="180" y1="0" x2="180" y2="160"/>
    <line x1="360" y1="0" x2="360" y2="160"/>
    <line x1="540" y1="0" x2="540" y2="160"/>
    <line x1="720" y1="0" x2="720" y2="160"/>
  </g>

  <!-- Connector lines between particles -->
  <line class="line" x1="80" y1="30" x2="200" y2="55" stroke="#378ADD" stroke-width="0.5" style="animation-duration:5s"/>
  <line class="line" x1="200" y1="55" x2="320" y2="25" stroke="#378ADD" stroke-width="0.5" style="animation-duration:6s"/>
  <line class="line" x1="80" y1="30" x2="155" y2="90" stroke="#378ADD" stroke-width="0.5" style="animation-duration:7s"/>
  <line class="line" x1="680" y1="40" x2="820" y2="25" stroke="#378ADD" stroke-width="0.5" style="animation-duration:5.5s"/>
  <line class="line" x1="820" y1="25" x2="860" y2="75" stroke="#378ADD" stroke-width="0.5" style="animation-duration:6.5s"/>
  <line class="line" x1="680" y1="40" x2="760" y2="90" stroke="#378ADD" stroke-width="0.5" style="animation-duration:8s"/>
  <line class="line" x1="55" y1="110" x2="155" y2="90" stroke="#378ADD" stroke-width="0.5" style="animation-duration:7s"/>
  <line class="line" x1="760" y1="90" x2="860" y2="75" stroke="#378ADD" stroke-width="0.5" style="animation-duration:6s"/>

  <!-- Particles -->
  <circle class="dot" cx="80" cy="30" r="3" fill="#378ADD" style="animation-duration:3.2s"/>
  <circle class="dot" cx="200" cy="55" r="2" fill="#85B7EB" style="animation-duration:2.8s;animation-delay:0.5s"/>
  <circle class="dot" cx="320" cy="25" r="2.5" fill="#378ADD" style="animation-duration:3.8s;animation-delay:1s"/>
  <circle class="dot" cx="155" cy="90" r="2" fill="#85B7EB" style="animation-duration:4s;animation-delay:0.3s"/>
  <circle class="dot" cx="55" cy="110" r="1.5" fill="#378ADD" style="animation-duration:3.5s;animation-delay:0.8s"/>
  <circle class="dot" cx="680" cy="40" r="3" fill="#378ADD" style="animation-duration:2.9s;animation-delay:0.2s"/>
  <circle class="dot" cx="820" cy="25" r="2" fill="#85B7EB" style="animation-duration:3.6s;animation-delay:0.7s"/>
  <circle class="dot" cx="860" cy="75" r="2.5" fill="#378ADD" style="animation-duration:4.2s;animation-delay:0.4s"/>
  <circle class="dot" cx="760" cy="90" r="2" fill="#85B7EB" style="animation-duration:3.1s;animation-delay:1.1s"/>
  <circle class="dot" cx="840" cy="115" r="1.5" fill="#378ADD" style="animation-duration:3.9s;animation-delay:0.6s"/>
  <circle class="dot" cx="30" cy="65" r="1.5" fill="#85B7EB" style="animation-duration:4.5s;animation-delay:0.9s"/>
  <circle class="dot" cx="380" cy="110" r="2" fill="#378ADD" style="animation-duration:3.3s;animation-delay:1.3s"/>
  <circle class="dot" cx="530" cy="30" r="1.5" fill="#85B7EB" style="animation-duration:2.7s;animation-delay:0.1s"/>
  <circle class="dot" cx="600" cy="95" r="2" fill="#378ADD" style="animation-duration:3.7s;animation-delay:0.5s"/>
  <circle class="dot" cx="460" cy="70" r="1.5" fill="#85B7EB" style="animation-duration:4.1s;animation-delay:0.8s"/>

  <!-- Waves at bottom -->
  <path class="wave1" d="M0,100 C150,80 300,120 450,100 C600,80 750,120 900,100 L900,160 L0,160 Z" fill="#0f2a4a" opacity="0.6"/>
  <path class="wave2" d="M0,110 C120,90 270,130 450,108 C630,86 780,126 900,108 L900,160 L0,160 Z" fill="#0a1f3a" opacity="0.7"/>
  <path class="wave3" d="M0,120 C100,100 280,140 450,118 C620,96 800,136 900,120 L900,160 L0,160 Z" fill="#091929" opacity="0.9"/>

  <!-- Text -->
  <text class="title" x="450" y="70" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="28" font-weight="600" fill="#e6f1fb" letter-spacing="1">Gede Deva Dharma</text>
  <text class="subtitle" x="450" y="100" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#85B7EB" letter-spacing="0.5">Full Stack Developer &nbsp;·&nbsp; Bali, Indonesia</text>
</svg>
