<svg width="900" height="100" viewBox="0 0 900 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .wave1f { animation: wf1 6s ease-in-out infinite; }
      .wave2f { animation: wf2 8s ease-in-out infinite; }
      .wave3f { animation: wf3 10s ease-in-out infinite; }
      .dotf   { animation: pf 3s ease-in-out infinite; }

      @keyframes wf1 {
        0%,100% { d: path("M0,45 C150,25 300,65 450,45 C600,25 750,65 900,45 L900,0 L0,0 Z"); }
        50%      { d: path("M0,55 C150,35 300,75 450,55 C600,35 750,75 900,55 L900,0 L0,0 Z"); }
      }
      @keyframes wf2 {
        0%,100% { d: path("M0,35 C120,15 270,55 450,33 C630,11 780,51 900,33 L900,0 L0,0 Z"); }
        50%      { d: path("M0,48 C120,28 270,68 450,46 C630,24 780,64 900,46 L900,0 L0,0 Z"); }
      }
      @keyframes wf3 {
        0%,100% { d: path("M0,25 C100,5 280,45 450,23 C620,1 800,41 900,25 L900,0 L0,0 Z"); }
        50%      { d: path("M0,35 C100,15 280,55 450,33 C620,11 800,51 900,35 L900,0 L0,0 Z"); }
      }
      @keyframes pf {
        0%,100% { opacity:0.35; r:2; }
        50%      { opacity:0.85; r:3.5; }
      }
    </style>

    <radialGradient id="bgGradF" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#0f1a2e"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </radialGradient>
  </defs>

  <rect width="900" height="100" fill="url(#bgGradF)"/>

  <!-- Subtle grid -->
  <g opacity="0.04" stroke="#378ADD" stroke-width="0.5">
    <line x1="0" y1="30" x2="900" y2="30"/>
    <line x1="0" y1="60" x2="900" y2="60"/>
    <line x1="225" y1="0" x2="225" y2="100"/>
    <line x1="450" y1="0" x2="450" y2="100"/>
    <line x1="675" y1="0" x2="675" y2="100"/>
  </g>

  <!-- Connector lines -->
  <line x1="80" y1="70" x2="200" y2="55" stroke="#378ADD" stroke-width="0.5" opacity="0.15"/>
  <line x1="200" y1="55" x2="310" y2="72" stroke="#378ADD" stroke-width="0.5" opacity="0.15"/>
  <line x1="680" y1="68" x2="800" y2="52" stroke="#378ADD" stroke-width="0.5" opacity="0.15"/>
  <line x1="800" y1="52" x2="870" y2="70" stroke="#378ADD" stroke-width="0.5" opacity="0.15"/>

  <!-- Particles -->
  <circle class="dotf" cx="80" cy="70" r="2" fill="#378ADD" style="animation-duration:3s"/>
  <circle class="dotf" cx="200" cy="55" r="1.5" fill="#85B7EB" style="animation-duration:3.5s;animation-delay:0.4s"/>
  <circle class="dotf" cx="310" cy="72" r="2" fill="#378ADD" style="animation-duration:2.8s;animation-delay:0.8s"/>
  <circle class="dotf" cx="450" cy="60" r="1.5" fill="#85B7EB" style="animation-duration:4s;animation-delay:0.2s"/>
  <circle class="dotf" cx="590" cy="75" r="2" fill="#378ADD" style="animation-duration:3.2s;animation-delay:0.6s"/>
  <circle class="dotf" cx="680" cy="68" r="1.5" fill="#85B7EB" style="animation-duration:3.8s;animation-delay:1s"/>
  <circle class="dotf" cx="800" cy="52" r="2" fill="#378ADD" style="animation-duration:2.9s;animation-delay:0.3s"/>
  <circle class="dotf" cx="870" cy="70" r="1.5" fill="#85B7EB" style="animation-duration:3.6s;animation-delay:0.7s"/>

  <!-- Waves from top -->
  <path class="wave1f" d="M0,45 C150,25 300,65 450,45 C600,25 750,65 900,45 L900,0 L0,0 Z" fill="#0f2a4a" opacity="0.6"/>
  <path class="wave2f" d="M0,35 C120,15 270,55 450,33 C630,11 780,51 900,33 L900,0 L0,0 Z" fill="#0a1f3a" opacity="0.7"/>
  <path class="wave3f" d="M0,25 C100,5 280,45 450,23 C620,1 800,41 900,25 L900,0 L0,0 Z" fill="#091929" opacity="0.9"/>
</svg>
